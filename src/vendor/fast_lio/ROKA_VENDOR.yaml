license: BSD-3-Clause
local_changes:
  - Livox support is optional and disabled for the VLP-16 build.
  - VLP-16 seconds-based per-point time is configured explicitly.
  - Output pose and body cloud are transformed from IMU origin to base_link.
  - TF publication is parameterized and disabled in the parallel mapping stack.
  - Map save snapshots the ikd-tree and writes one binary-compressed PCD.
  - Unbounded point accumulation and always-on debug files are disabled.

