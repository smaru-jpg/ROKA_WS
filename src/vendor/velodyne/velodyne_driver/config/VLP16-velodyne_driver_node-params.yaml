velodyne_driver_node:
    ros__parameters:
        device_ip: 192.168.1.201
        gps_time: false
        time_offset: 0.0
        enabled: true
        read_once: false
        read_fast: false
        repeat_delay: 0.0
        frame_id: velodyne
        model: VLP16
        rpm: 600.0
        port: 2368
        # FAST-LIO deskews each return from the PointCloud2 header timestamp.
        # Use the first packet as the scan epoch so the per-point `time` field
        # increases from 0 to roughly 0.1 s instead of being entirely negative.
        timestamp_first_packet: true
