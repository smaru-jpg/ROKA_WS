teleop_twist_joy_node:
  ros__parameters:
    # ROKA Xbox BT 9C:AA:1B:72:51:9D / USB 30324E4530303834353334393035.
    # Xbox left stick: vertical is axis 1, horizontal is axis 0.
    axis_linear:
      x: 1
    scale_linear:
      x: 0.30
    scale_linear_turbo:
      x: 0.30
    axis_angular:
      yaw: 0
    scale_angular:
      yaw: 0.60
    scale_angular_turbo:
      yaw: 0.60
    # Hold LB while driving. Releasing it publishes a zero Twist.
    enable_button: 4
    enable_turbo_button: -1
    require_enable_button: true
    inverted_reverse: false
    publish_stamped_twist: false
