fixed_map_localizer:
  ros__parameters:
    map_frame: map
    local_frame: odom
    body_frame: base_link
    odom_topic: /lio/odom
    cloud_topic: /lio/cloud_body
    map_leaf_size_m: 0.20
    source_leaf_size_m: 0.20
    registration_period_sec: 0.35
    maximum_odom_cloud_delta_sec: 0.05
    local_map_radius_m: 12.0
    ndt_resolution_m: 0.50
    ndt_step_size_m: 0.10
    ndt_transformation_epsilon: 0.005
    ndt_maximum_iterations: 30
    maximum_fitness_score: 0.20
    maximum_translation_correction_m: 0.50
    maximum_z_correction_m: 0.30
    maximum_rotation_correction_rad: 0.35
    required_stable_matches: 2
    smoothing_alpha: 0.35
    initial_search_xy_m: 0.75
    initial_search_xy_step_m: 0.75
    initial_search_yaw_rad: 1.57079632679
    initial_search_yaw_step_rad: 0.78539816339
    initial_ndt_resolution_m: 1.0
    initial_ndt_maximum_iterations: 15
    publish_tf: true
