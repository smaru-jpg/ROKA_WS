roka_manual_arm_joy:
  ros__parameters:
    arm_serial_port: /dev/serial/by-id/usb-FTDI_USB__-__Serial_Converter_FT89FBMQ-if00-port0
    wrist_serial_port: /dev/serial/by-id/usb-FTDI_USB__-__Serial_Converter_FT78LQH1-if00-port0
    torque_off_on_exit: false
    joy_topic: /joy

    # Linux/ROS Xbox layout used by the assigned ROKA controller:
    # right stick X/Y = axes 3/4, D-pad vertical = axis 7, RB = button 5.
    enable_button: 5
    joint_13_axis: 4
    joint_11_axis: 3
    wrist_axis: 7
    deadzone: 0.18
    control_rate_hz: 20.0
    joy_timeout_sec: 0.35

    # Joystick values are integrated into absolute Goal Position values.
    # Existing arm/wrist hard limits are applied after every integration step.
    joint_13_rate_counts_sec: 8000.0
    joint_11_rate_counts_sec: 5000.0
    wrist_rate_counts_sec: 300.0
    joint_13_sign: 1.0
    joint_11_sign: 1.0
    wrist_sign: 1.0
