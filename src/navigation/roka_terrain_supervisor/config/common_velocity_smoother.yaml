terrain_velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.60, 0.0, 0.80]
    min_velocity: [-0.30, 0.0, -0.80]
    max_accel: [0.50, 0.0, 1.00]
    max_decel: [-0.70, 0.0, -1.20]
    odom_topic: /odom
    odom_duration: 0.2
    deadband_velocity: [0.01, 0.0, 0.01]
    velocity_timeout: 0.35
