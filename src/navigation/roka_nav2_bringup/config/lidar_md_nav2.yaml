amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_footprint
    global_frame_id: map
    odom_frame_id: odom
    scan_topic: /scan_stabilized
    robot_model_type: nav2_amcl::DifferentialMotionModel
    laser_model_type: likelihood_field
    laser_likelihood_max_dist: 2.0
    laser_min_range: 0.3
    laser_max_range: 30.0
    max_beams: 90
    min_particles: 500
    max_particles: 2000
    # The guarded path follower checks that AMCL has processed a recent scan
    # before it accepts Xbox A.  With motion-gated updates, a correctly parked
    # robot publishes only its initial pose and is falsely rejected as stale.
    # The stabilized scan is only about 4-6 Hz, so updating on every scan is
    # inexpensive and provides a meaningful stationary localization check.
    update_min_d: 0.0
    update_min_a: 0.0
    # The VLP-16 scan used by AMCL can arrive roughly 0.4-0.55 s behind wall
    # time during the full field stack.  A 0.5 s transform horizon then leaves
    # map->odom a few tens of milliseconds behind the controller request and
    # FollowPath aborts without moving.  One second covers one delayed scan
    # while AMCL continues to correct map->odom on every received scan.
    transform_tolerance: 1.0
    tf_broadcast: true
    # Initial placement is approximate and may change. Seed AMCL with RViz 2D
    # Pose Estimate; AMCL then refines it from the live scan. Never claim that
    # odom reset means the robot is at map (0, 0, 0).
    set_initial_pose: false
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 15.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    # Tolerate a single slow localization/TF cycle instead of aborting the
    # complete section after 0.3 s.  Physical output still passes through the
    # terrain supervisor, collision monitor and Xbox B stop.
    failure_tolerance: 1.0
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.25
      movement_time_allowance: 15.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      # Open mapped sections stop by position. Exact final heading is neither
      # reproducible from one Xbox demonstration nor safe to correct with an
      # in-place skid turn on a banked surface.
      # The continuous follower supplies progress/endpoint completion. The
      # operator is not required to reproduce one recorded endpoint exactly.
      xy_goal_tolerance: 0.30
      yaw_goal_tolerance: 0.70
    FollowPath:
      # Humble-native low-compute controller with curvature/proximity speed
      # regulation and forward collision checking. This is a better default
      # for the low-speed differential/skid-steer platform than the old DWB
      # tuning copied from the migration scaffold.
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.30
      lookahead_dist: 0.50
      min_lookahead_dist: 0.30
      max_lookahead_dist: 0.65
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.50
      transform_tolerance: 0.3
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.60
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.50
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 8.0
      regulated_linear_scaling_min_radius: 0.50
      regulated_linear_scaling_min_speed: 0.10
      # PK-3A is only 0.9144 m wide. In-place skid-steer rotation on the bank
      # is disabled; the recorded path must begin with the correct heading.
      use_rotate_to_heading: false
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 0.80
      use_interpolation: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 8.0
      publish_frequency: 3.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      # Supplied STEP envelope in REP-103 body axes, with about 10 mm planar
      # margin: front +0.58, rear -0.28, half-width 0.302 m.
      footprint: "[[0.59, 0.312], [0.59, -0.312], [-0.29, -0.312], [-0.29, 0.312]]"
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan_stabilized
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_max_range: 8.0
          obstacle_min_range: 0.30
          raytrace_max_range: 10.0
          raytrace_min_range: 0.30
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 8.0
        inflation_radius: 0.42
      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""
    topic_name: map
